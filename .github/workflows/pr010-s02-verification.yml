name: pr010-s02-verification

on:
  pull_request:
    branches: [main]

jobs:
  s02-windows-effect-and-structured-mutation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Run PR-010 S02 focused verification
        run: >-
          python -m pytest -q
          tests/test_operation_effect_registry.py
          tests/test_structured_mutation_firewall.py
          tests/test_canonical_repository_firewall.py
          tests/test_repository_identity_compatibility.py
          tests/test_handlers_edit.py
          tests/test_handlers_fsmutate.py
          tests/test_handlers_upload.py
          tests/test_upload_land_in_place.py
          tests/test_git_network.py
          tests/test_git_recount.py