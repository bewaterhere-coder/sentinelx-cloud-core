name: pr011-s05-verification

on:
  pull_request:
    branches: [main]

jobs:
  s05-devforge-runtime-verification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PR-011 S05 schema and integration regressions
        run: >-
          python -m pytest -q
          tests/test_devforge_runtime_local_api.py
          tests/test_local_api.py
          tests/test_verification_profile_contracts.py
