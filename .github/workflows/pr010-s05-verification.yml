name: pr010-s05-verification

on:
  pull_request:
    branches: [main]

jobs:
  s05-windows-incident-security-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Run PR-010 S05 incident and security regression suite
        run: >-
          python -m pytest -q
          tests/test_canonical_repository_firewall.py
          tests/test_canonical_repository_firewall_incident_regression.py
          tests/test_structured_mutation_firewall.py
          tests/test_operation_effect_registry.py
          tests/test_process_mutation_effect_registry.py
          tests/test_canonical_repository_firewall_readiness.py
          tests/test_incident_20260927_d_root_recursive_delete.py
