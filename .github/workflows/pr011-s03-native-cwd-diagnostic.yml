name: pr011-s03-native-cwd-diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-cwd:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Verify native cwd and unprofiled regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_verification_native_cwd_diagnostic.py tests/test_scoped_script_execution.py
