name: pr011-s03-transactional-apply

on:
  push:
    branches:
      - task/scoped-verification-toolchain-dependency-capsule-v1
    paths:
      - .devforge-staging/pr011-s03.patch

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip cleanup-triggered replay
        id: staged
        shell: pwsh
        run: |
          if (Test-Path '.devforge-staging/pr011-s03.patch') {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Apply S03 execution-workspace patch
        if: steps.staged.outputs.present == 'true'
        shell: pwsh
        run: |
          git apply --check --whitespace=error-all .devforge-staging/pr011-s03.patch
          git apply --whitespace=error-all .devforge-staging/pr011-s03.patch
          git diff --check

      - name: Compile S03 Python surfaces
        if: steps.staged.outputs.present == 'true'
        shell: pwsh
        run: |
          python -m py_compile `
            src/sentinelx_core/handlers/script.py `
            src/sentinelx_core/handlers/scoped_script.py `
            src/sentinelx_core/verification_runtime.py `
            tests/test_verification_runtime.py `
            tests/test_scoped_verification_execution.py

      - name: Run S03 focused verification
        if: steps.staged.outputs.present == 'true'
        shell: pwsh
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest -q `
            tests/test_verification_runtime.py `
            tests/test_scoped_verification_execution.py `
            tests/test_scoped_script_execution.py `
            tests/test_verification_windows_materialization.py

      - name: Commit verified S03 product candidate and remove staging
        if: steps.staged.outputs.present == 'true'
        shell: pwsh
        run: |
          Remove-Item -Force .devforge-staging/pr011-s03.patch
          Remove-Item -Force .github/workflows/pr011-s03-apply.yml
          if (Test-Path .devforge-staging -PathType Container) {
            $remaining = Get-ChildItem .devforge-staging -Force
            if ($remaining.Count -eq 0) { Remove-Item -Force .devforge-staging }
          }
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-011 S03: compose offline scoped verification execution'
          git push origin HEAD:task/scoped-verification-toolchain-dependency-capsule-v1
