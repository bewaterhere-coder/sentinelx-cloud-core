name: pr007-s06-verify

on:
  push:
    branches:
      - task/host-mutation-scope-control-surface-mcp-admission-bridge-v1

jobs:
  focused-s06:
    if: github.repository == 'bewaterhere-coder/sentinelx-cloud-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff touched surfaces
        run: |
          python -m ruff check \
            src/sentinelx_core/handlers/__init__.py \
            src/sentinelx_core/handlers/devforge_runtime.py \
            src/sentinelx_core/handlers/local_api.py \
            src/sentinelx_core/handlers/mutation_scope.py \
            tests/test_devforge_runtime_local_api.py
      - name: Focused S06 tests
        run: |
          python -m pytest -q \
            tests/test_devforge_runtime_local_api.py \
            tests/test_local_api.py \
            tests/test_mutation_scope_handler.py \
            tests/test_mutation_scope_registry.py
