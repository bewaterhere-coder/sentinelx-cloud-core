name: pr007-s07-verify

on:
  push:
    branches:
      - task/host-mutation-scope-control-surface-mcp-admission-bridge-v1

jobs:
  focused-s07:
    if: github.repository == 'bewaterhere-coder/sentinelx-cloud-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff touched surfaces
        run: |
          python -m ruff check \
            src/sentinelx_core/handlers/__init__.py \
            src/sentinelx_core/handlers/devforge_runtime.py \
            tests/test_devforge_runtime_local_api.py \
            tests/test_scoped_script_execution.py
      - name: Focused S07 adapter tests
        run: |
          python -m pytest -q \
            tests/test_devforge_runtime_local_api.py \
            tests/test_local_api.py \
            tests/test_mutation_scope_handler.py \
            tests/test_mutation_scope_registry.py

  windows-s07-security:
    if: github.repository == 'bewaterhere-coder/sentinelx-cloud-core'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Windows scoped execution and incident regressions
        shell: powershell
        run: |
          python -m pytest -q tests/test_scoped_script_execution.py tests/test_incident_20260927_d_root_recursive_delete.py
