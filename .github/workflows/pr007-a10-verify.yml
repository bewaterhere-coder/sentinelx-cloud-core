name: pr007-a10-verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff focused surfaces
        run: python -m ruff check --ignore UP017 src/sentinelx_core/handlers/basic.py tests/test_devforge_runtime_local_api.py tests/test_mutation_scope_registry.py
      - name: Pytest A10 help and local_api contract
        run: python -m pytest tests/test_devforge_runtime_local_api.py tests/test_mutation_scope_registry.py -q
