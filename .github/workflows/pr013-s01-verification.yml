name: pr013-s01-verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-transaction-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run PR-013 S01 contract and regression tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_repository_transaction.py
          tests/test_devforge_runtime_local_api.py
          tests/test_local_api.py
          tests/test_mutation_scope_admission.py
          tests/test_mutation_scope_handler.py
          tests/test_mutation_scope_registry.py
          tests/test_scoped_script_execution.py
          tests/test_user_scoped_git.py
          tests/test_canonical_repository_firewall.py
          tests/test_canonical_repository_firewall_readiness.py
