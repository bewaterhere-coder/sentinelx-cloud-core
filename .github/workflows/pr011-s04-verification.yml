name: pr011-s04-verification
# Windows/AppContainer regression coverage for PR-011 S04.  This workflow is
# not the required Host-workspace acceptance proof; the S04 physical gate must
# still execute under the configured Windows Host workspace rooted at D:\coco\workspaces.

on:
  pull_request:
    branches: [main]

jobs:
  s04-readiness-physical-proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run PR-011 S04 readiness and physical regressions
        run: >-
          python -m pytest -q
          tests/test_verification_readiness.py
          tests/test_release_activation_boundary.py
          tests/test_verification_scoped_execution.py
          tests/test_verification_windows_materialization.py
          tests/test_verification_runtime.py
          tests/test_verification_profile_contracts.py
          tests/test_scoped_script_execution.py
