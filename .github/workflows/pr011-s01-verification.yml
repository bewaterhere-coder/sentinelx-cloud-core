name: pr011-s01-verification

on:
  pull_request:
    branches: [main]

jobs:
  s01-verification-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run PR-011 S01 verification contracts
        run: >-
          python -m pytest -q
          tests/test_verification_profile_contracts.py
          tests/test_canonical_repository_firewall.py
