name: pr010-s03-verification

on:
  pull_request:
    branches: [main]

jobs:
  s03-windows-process-firewall:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Run PR-010 S03 focused verification
        run: >-
          python -m pytest -q
          tests/test_process_mutation_effect_registry.py
          tests/test_operation_effect_registry.py
          tests/test_scoped_script_execution.py
          tests/test_windows_mutation_sandbox.py
          tests/test_devforge_workspace_placement.py
