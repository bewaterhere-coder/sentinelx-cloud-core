name: pr010-finalization-integration-verification

on:
  push:
    branches: [task/canonical-repository-mutation-firewall-v1]

jobs:
  registry-local-api-firewall-composition:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Verify PR-007 and PR-010 composition
        run: >-
          python -m pytest -q
          tests/test_devforge_runtime_local_api.py
          tests/test_mutation_scope_registry.py
          tests/test_mutation_scope_handler.py
          tests/test_operation_effect_registry.py
          tests/test_canonical_repository_firewall_readiness.py
          tests/test_protocol_features_match.py
