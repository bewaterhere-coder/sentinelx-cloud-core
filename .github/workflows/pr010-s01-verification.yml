name: pr010-s01-verification

on:
  pull_request:
    branches: [main]

jobs:
  s01-windows-identity-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run PR-010 S01 focused verification
        run: >-
          python -m pytest -q
          tests/test_canonical_repository_firewall.py
          tests/test_repository_identity_compatibility.py
