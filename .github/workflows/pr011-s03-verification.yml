name: pr011-s03-verification

on:
  pull_request:
    branches: [main]

jobs:
  s03-offline-node-npm:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run PR-011 S03 scoped offline verification
        run: >-
          python -m pytest -q
          tests/test_verification_scoped_execution.py
          tests/test_verification_runtime.py
          tests/test_scoped_script_execution.py
