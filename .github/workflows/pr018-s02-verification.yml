name: pr018-s02-verification

on:
  pull_request:
    branches:
      - task/large-runtime-root-acl-cleanup-timeout-recovery-v1

jobs:
  s02-windows-security-regression:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PR-018 S02 focused regressions
        run: >-
          python -m pytest -q
          tests/test_policy.py
          tests/test_mutation_scope_admission.py
          tests/test_windows_mutation_sandbox.py
          tests/test_scoped_script_execution.py
          tests/test_verification_windows_materialization.py
          tests/test_verification_scoped_execution.py
