name: pr010-s04-verification

on:
  pull_request:
    branches: [main]

jobs:
  s04-windows-capability-readiness:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Run PR-010 S04 focused verification
        run: >-
          python -m pytest -q
          tests/test_canonical_repository_firewall_readiness.py
          tests/test_operation_effect_registry.py
          tests/test_protocol_features_match.py
