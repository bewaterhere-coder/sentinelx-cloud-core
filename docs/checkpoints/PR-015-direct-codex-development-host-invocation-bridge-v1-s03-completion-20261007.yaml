implementation:
  summary: >-
    S03 hardens the structured direct/Codex receipt contract and proves the
    delivered bridge as product-under-test. normalize_result now carries the
    canonical repository identity; validate_receipt requires the exact
    Task/Run/Attempt/Slice echo, the exact canonical repository and PR echo,
    actual-branch == canonical-branch (fail-closed even when the receipt
    claims consistency), and the existing workspace/transport/receipt
    invariants. The exact-candidate physical proof then exposed and fixed a
    real S02-correction regression in user_git (missing userenv DLL binding).
  changes:
    - src/sentinelx_core/direct_codex_result.py: repository identity echo in the
      payload; validate_receipt extended to exact run_id/attempt_id echo,
      canonical_pr and canonical_repository echo, and an explicit
      receipt_branch_mismatch fail-closed check for forged-consistent receipts
    - src/sentinelx_core/handlers/direct_codex.py: call() passes the full
      admitted identity (run_id, attempt_id, canonical_pr, canonical_repository)
      into validate_receipt
    - src/sentinelx_core/user_git.py: restore the userenv DLL binding in
      _run_windows_user_git that the S02 correction refactor accidentally
      dropped; every real user-scoped Git call failed with
      "name 'userenv' is not defined" wrapped as
      GitExecutionContextUnavailable
    - tests/test_direct_codex_execution.py: exact echo positives/negatives,
      forged-consistent branch-drift negative, remote-readback drift negative,
      15-case malformed-receipt parametrization, and the new
      _receipt_kwargs identity helper
    - tests/test_user_scoped_git.py: regression test proving the Windows runner
      fails only at its true privilege boundary (WTSQueryUserToken WinError
      1314) and never on a Python NameError artifact

