    focused_result: 33 passed (test_direct_codex_execution 29, test_user_process 4)
    regression_subset: tests/test_policy.py + tests/test_user_scoped_git.py +
      tests/test_direct_codex_provider.py: 82 passed; the single failure is the
      documented symlink-privilege test (WinError 1314/5), a pre-existing
      host-privilege failure re-confirmed against the unmodified baseline, not
      an S03 regression
    physical_proof:
      driver: D:\coco\workspaces\bewaterhere-coder\sentinelx-cloud-core\pr015-s03-proof\driver.py
      evidence_files:
        - proof-result.json
        - proof-receipt.json
        - proof-run.log / proof-run5.log / proof-run6.log / proof-final.log
      product_under_test: >-
        The delivered devforge_direct_codex bridge in the S03 workspace with
        the REAL installed Codex Development Host (@openai/codex 0.154.0, node
        v24.19.0, ChatGPT session), the real Windows MIC containment proof and
        the real active-user process substrate.
      fixture: >-
        Local bare origin seeded from the exact task-branch head 7ae1710 so the
        canonical GitHub transport was never touched; exact canonical identity
        used: repository git://github.com/bewaterhere-coder/sentinelx-cloud-core,
        PR 15, branch task/direct-codex-development-host-invocation-bridge-v1.
      runs: 3 complete end-to-end runs (runs 4/6/final) plus one run that
        failed fast on an unsupported host default model (see host findings)
      physically_proven:
        - MIC containment: low-integrity child wrote inside the workspace and
          was refused (EPERM) on the protected workspace-root sibling by
          windows_mandatory_integrity_control; no contamination
        - independent checkout at the exact CAS head; canonical checkout
          untouched (before/after head comparison)
        - real @openai/codex chain discovery/verification and bounded
          active-user execution with job containment and process-tree closure
        - exact identity echo (task/run/attempt/slice, PR 15, canonical
          repository, canonical branch == actual branch)
        - remote readback consistent with the claimed resulting head
        - local-only unpersisted implementation reported as
          implementation_not_persisted, never as success (3x, real host)
        - persistent project binding direct/codex unchanged
      successful_receipt_semantics: >-
        The valid persisted receipt (provider direct, adapter codex, exact
        identity, published, remote-readback-consistent) is proven by
        test_execute_task_completes_exact_transport_and_receipt with the
        committed fixture host and passes with the S03 hardening in place.
      material_finding_real_host_persistence_gap:
        finding: >-
          The real Codex host (0.154.0, its own workspace-write sandbox) does
          real slice work inside the isolated checkout (file edits, pytest
          runs) but never commits: local_head stays at the admitted CAS head,
          so the provider-owned publish does not fire and the receipt is
          honestly incomplete (implementation_not_persisted). The delivered
          bridge commits nothing on the host's behalf, and provider-owned
          persistence (commit-on-publish of the direct host's work) is NOT in
          the S03 authorized-change list, so it was not implemented here.
        impact: >-
          With the current plan, a real Codex host cannot produce a persisted
          successful receipt on its own. Acceptance's deployed proof
          (PR-013 provider-admission recovery) needs either (a) the direct
          host to commit within its sandbox, or (b) a plan revision adding
          provider-owned commit-on-publish of the direct host's verified work.
        decision_owner: human (plan/acceptance boundary); material decision
          returned to the operator, not auto-resolved
      host_findings:
        - >-
          user-scoped Git (WTSQueryUserToken) is unavailable from a normal
          user shell on this host (WinError 1314, pre-existing constraint);
          the proof driver records the substitution and uses the SAME fixed
          Git argv through a direct subprocess (no shell) for transport Git
          only; process execution stayed on the real user-scoped substrate
        - >-
          the host's ~/.codex default model gpt-6.1-sol is rejected by the
          ChatGPT account (HTTP 400); the bridge failed closed and reported
          the execution as failed. For the proof runs the default model was
          temporarily switched to gpt-6-astra and the original config restored
          afterwards from backup
        - >-
          a leftover codex .pytest_cache inside the derived workspace broke the
          next MIC restamp (SetNamedSecurityInfoW WinError 5, the documented
          host limitation); later proof runs used a fresh derived workspace

