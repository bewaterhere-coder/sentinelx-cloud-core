timing_repair:
  candidate_head: 31678bcc2f1495336fcb1041c8e49e3d682f5919
  design:
    - verification materialization grants only the exact toolchain RX authority
    - create the AppContainer root suspended using the previously proven root-process path
    - prove the suspended root is no-breakaway Job-contained
    - only then grant the unique verification AppContainer SID Session-0 read ACE
    - commit durable PROCESS_SPAWNED evidence and resume the root
    - revoke Session-0 ACE during fail-closed cleanup and terminalization
  rationale: >
    Session-0 read authority is needed by USER32-linked descendants, but must not
    perturb root CreateProcess initialization. Delaying the grant until after the
    root exists suspended preserves the prior proven creation boundary while still
    making the authority available before any descendant can run.
  verification_update:
    - physical ACL test now asserts Session-0 authority is absent before spawn
    - physical ACL test asserts it is present after suspended-root creation/spawn
    - terminalization still requires complete ACE revocation
  prepared_workspace: D:\coco\workspaces\bewaterhere-coder\sentinelx-cloud-core\pr011-s03r-session-object-v5
