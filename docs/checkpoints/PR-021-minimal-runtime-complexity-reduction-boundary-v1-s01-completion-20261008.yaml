key_observations:
  - Direct Codex on main is a full SentinelX-owned Agent lifecycle path with a 300-second real sandbox probe and multiple Codex-specific support modules.
  - Generic background execution already exists independently through jobs/client/script/exec, with a one-hour ceiling; pending_results preserves completion delivery, not running-job truth.
  - Mutation Scope, fail-closed mutation audit, AppContainer/ACL/Job sandbox, operation/effect registry and canonical repository firewall are security substrates, not long-Agent orchestration features.
  - PR-014 is blocked at S02 on DirectDevelopmentHostInvocationProjectionUnavailable with direct:codebuddy bootstrap, while its completed S01 branch code reuses existing scope/sandbox security primitives.
  - PR-020 is blocked before S01 and proposes a generic Durable Async runtime specifically to make long operations survive the synchronous request lifetime.
  - PR-229 is bewaterhere-coder/devforge-harness#229, a Harness consumer task for incremental_execution.slice_v1; DevForge Core slicing itself is already merged in DevForge#3 and current Core contract v1.1.
  - Current DevForge project registry still binds sentinelx-cloud-core to provider=direct adapter=codex; PR-021 does not authorize changing that binding.

