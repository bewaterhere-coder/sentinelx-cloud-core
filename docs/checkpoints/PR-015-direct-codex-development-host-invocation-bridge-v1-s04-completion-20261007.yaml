implementation:
  summary: >-
    S04 delivers the provider-owned deterministic persistence and canonical publish
    closure that Requirement Revision 2 requires and that Acceptance R1's real-host
    finding identified as missing. The direct/Codex transport now separates
    authenticated object acquisition from first worktree materialization, freezes a
    provider-owned pre-checkout canonicalization snapshot (allowlisted safe
    normalization scalars, provider inspection index seeded from the exact admitted
    parent, effective custom-filter rejection, system/global attribute
    neutralization, .git/info/attributes emptiness), materializes the worktree under
    provider-owned clamps, and re-proves the same frozen authority after the direct
    host ran. A new bounded persistence broker derives the eligible delta from the
    worktree (never from the Codex-owned index), builds the candidate in a
    provider-owned temporary index seeded from the exact admitted parent, verifies
    the candidate tree equals parent + exactly the validated delta, creates one
    deterministic provenance-bound commit with frozen identity/timestamp, moves a
    provider-local candidate ref under CAS, persists publish_intent, performs an
    ordinary fast-forward push to the exact canonical branch and independently reads
    the remote back. The same-attempt recovery journal is stored outside the
    candidate set and reconstructs a bit-identical candidate across prepared/
    tree_ready/candidate_ready/local_ref_ready interruptions, and a publish_intent
    recovery performs readback only and never issues a hidden second push. A
    verified no-change outcome is reported distinctly and never fabricates an empty
    implementation commit. The structured receipt gains a bounded persistence block
    and validate_receipt now requires candidate commit, ordinary publish and remote
    readback equality for a valid persisted success.
  changes:
    - "src/sentinelx_core/direct_codex_transport.py: Phase A/B/C/D split (object
      acquisition vs first worktree materialization), CanonicalizationSnapshot,
      provider-owned execution state, inspection index, effective attribute
      inspection with custom-filter rejection, materialization clamps/env,
      provider-clamped checkout and post-run revalidation"
    - "src/sentinelx_core/direct_codex_persistence.py (new): provider-owned
      persistence broker — worktree inventory, mode/gitlink/path validation,
      temporary-index candidate tree + verification, deterministic commit with
      frozen identity, recovery journal/state machine, CAS local ref, ordinary
      fast-forward publish, independent readback, publish_intent readback-only
      recovery"
    - "src/sentinelx_core/direct_codex_result.py: persistence block in the result,
      receipt version 2, persistence/readback/candidate/base-head validation"
    - "src/sentinelx_core/handlers/direct_codex.py: execute_task calls the
      persistence broker after the bounded Codex run and passes the outcome into
      result normalization; the previous provider push helper is replaced"
    - "src/sentinelx_core/user_git.py: provider-owned closed Git environment
      allowlist (GIT_INDEX_FILE, frozen ident/date, config/attribute
      neutralization, literal pathspecs) on the fixed Git primitive"
    - "tests/test_direct_codex_execution.py: receipt-contract update for the new
      persistence requirement plus real-host edit/no-change end-to-end fixtures"
    - "tests/test_direct_codex_persistence.py (new): 30 focused canonicalization/
      filter/CRLF/binary/working-tree-encoding/candidate/index-authority/recovery/
      publication/drift/canonical-isolation tests"
  product_candidate_sha: 02eb3de2ec9c137b3285398e555f1e037b574965

verification:
  required:
    - clone/fetch obtains the exact admitted commit without materializing the worktree
    - safe canonicalization snapshot is persisted and read back before checkout
    - any effective custom filter on a tracked expected-tree path fails before
      checkout and its marker process never runs
    - system/global attributes are neutralized and non-empty .git/info/attributes
      blocks checkout
    - provider-clamped checkout uses the exact frozen snapshot
    - a Windows CRLF worktree for an LF parent blob re-canonicalizes to the exact
      parent blob when unchanged
    - a one-line semantic edit does not create whole-file EOL churn
    - binary bytes remain exact and supported working-tree-encoding round-trips
      deterministically
    - Codex add/delete/modify of a versioned .gitattributes fails before candidate
      creation
    - a pre-staged excluded Codex-index entry cannot enter the provider candidate tree
    - the temporary candidate index is seeded from the exact admitted parent and
      contains only the validated canonical eligible delta
    - hooks/signing/fsmonitor/pager/prompt/submodule recursion cannot execute through
      local materialization/persistence
    - unmerged state, unsupported gitlink/submodule mutation and path escape fail closed
    - the same attempt reconstructs a bit-identical candidate across
      prepared/tree_ready/candidate_ready/local-ref-ready interruptions
    - publish_intent recovery performs readback only and never an automatic second push
    - remote drift before publish fails without push
    - an ordinary push targets only the exact canonical branch and the remote readback
      must equal the candidate
    - no eligible changes does not manufacture an empty implementation commit
    - a malformed or local-only persistence receipt cannot be success
    - canonical checkout branch/head/index/worktree remain unchanged
    - existing S01-S03 direct-Codex/firewall/scoped-verification/user-scoped-Git
      regressions remain green
    - real Windows @openai/codex physical fixture proves edit -> provider commit ->
      ordinary fixture-branch push -> remote readback -> persisted direct/codex receipt
