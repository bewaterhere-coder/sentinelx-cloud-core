  - id: PR013-R1-F2-materialization-execution-identity
    classification: plan_local
    disposition: remediated
    changes:
      - repository source bytes are written only by provider-generated materializer under scope-derived Windows AppContainer and Job
      - durable START precedes source writes
      - temporary exact read-only snapshot grant and exact workspace-only write authority specified
      - canonical checkout, authority store and user credential access remain absent
      - operation closure removes Job/PID/ACL authority and reads it back
      - physical Windows evidence must reject direct unrestricted service-copy substitution
  - id: PR013-R1-F3-publication-content-handoff-credential-boundary
    classification: plan_local
    disposition: remediated
    changes:
      - post-execution workspace content is frozen into immutable provider-owned publication capsule after process quiescence
      - credential-bearing Git never receives scoped-workspace access
      - fixed Git plumbing/raw blob hashing/no hooks/no filters/no signing/no shell semantics specified
      - produced commit persists before non-force push
      - uncertain push is readback-first and reuses the same produced commit
  - id: PR013-R1-F4-acceptance-downstream-authority-mixed-into-implementation
    classification: plan_local
    disposition: remediated
    changes:
      - implementation slices limited to product code, fixture harness and candidate verification
      - live Agent activation/restart and accepted-candidate physical proof moved to Acceptance
      - ChatGPTControlShell AC13 proof requires separately issued downstream canonical command
      - SentinelX Acceptance may consume downstream receipt but cannot inherit or synthesize downstream authority
