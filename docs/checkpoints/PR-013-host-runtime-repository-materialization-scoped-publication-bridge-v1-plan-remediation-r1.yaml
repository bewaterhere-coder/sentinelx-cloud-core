findings:
  - id: PR013-R1-F1-repository-transaction-scope-admission
    classification: plan_local
    disposition: remediated
    changes:
      - froze purpose=repository_transaction_v1 on existing provision_scope
      - provider maps purpose to fixed repository_materialize/repository_execute/repository_publish classes
      - caller cannot supply or enlarge operation classes
      - same-Attempt exact retry/idempotency and conflict behavior specified
