entry_reconciliation:
  required_before_slice: S01
  canonical_main_at_review: f7e878f3497582547e5d52cd33b060cae18d2e84
  required_reads:
    - canonical main HEAD
    - PR-008 current state/head
    - src/sentinelx_core/mutation_scope.py
    - src/sentinelx_core/handlers/scoped_script.py
    - handler registry/capability seams touched by S02/S03
  decision_boundary:
    condition: current main or PR-008 materially changed MutationScopeStore/scoped_script/registry/capability seams from reviewed assumptions
    action: stop before product-code mutation and reconcile slice inputs
invariants:
  - provider_is_only_scope_and_workspace_authority
  - caller_cannot_supply_allowed_operation_classes
  - caller_cannot_supply_required_operation_class
  - scoped_script_operation_class_is_consumed_before_material_mutation
  - existing_mutation_scope_store_is_single_authority
  - bound_readback_is_pure_and_non_reactivating
  - existing_scoped_executor_appcontainer_and_audit_paths_are_reused
  - no_unrestricted_or_wrapper_fallback
  - terminalize_is_not_generic_process_kill
  - hub_capability_is_never_inferred_from_agent_source
slices:
  - id: S01
    title: Authority admission and exact bound readback
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s01-completed-20261002.yaml
    objective: Strengthen the canonical scope authority so scoped script execution consumes durable operation-class authorization and external inspect can perform exact non-reactivating bound readback.
    primary_surfaces:
      - src/sentinelx_core/mutation_scope.py
      - src/sentinelx_core/handlers/scoped_script.py
      - tests/test_mutation_scope*.py
      - tests/test_scoped_script_execution.py
    required_behavior:
      - add provider-owned operation-aware scope revalidation that reuses existing exact revalidation and requires internal scoped_script authority
      - existing scoped script path uses operation-aware admission before audit START/materialization/sandbox activation/spawn
      - caller cannot select or widen required operation class
      - reuse existing read_scope authority and add same-store exact generation/repository/semantic bound pure readback
      - terminal/current readback never reactivates or repairs authority
    verification:
      - authorized scoped_script class passes admission
      - missing scoped_script class fails before audit/materialization/activation/spawn
      - same-Attempt retry cannot change class set
      - wrong generation/repository/project/task/run/attempt/slice inspect fails
      - terminal bound inspect returns terminal evidence without state change
    completion_rule: all focused S01 tests pass and no duplicate authority/readback path exists
    next_on_pass: S02

  - id: S02
    title: Lifecycle handler and provider-owned purpose mapping
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s02-completed-20261002.yaml
    objective: Expose bounded mutation_scope lifecycle actions over the existing store without transferring authority to the caller.
    primary_surfaces:
      - src/sentinelx_core/handlers/mutation_scope.py
      - src/sentinelx_core/handlers/__init__.py
      - focused handler tests
    required_behavior:
      - actions provision/revalidate/inspect/terminalize
      - strict repository lineage and scope-ref parsing
      - purpose scoped_script maps internally to canonical class
      - reject authority-shaped caller fields including paths class sets required_operation_class placement sandbox/digest overrides
      - inspect consumes S01 bound readback
      - terminalize preserves fail-closed active-runtime semantics and is not a process-kill API
      - RequestContext remains transport-derived authority
    verification:
      - valid lifecycle requests produce bounded provider-issued evidence
      - malformed/authority-shaped payloads fail closed
      - duplicate provision remains idempotent without broadened authority
      - active-runtime terminalize cannot fabricate closure
    completion_rule: lifecycle handler tests pass with no second executor/store/ledger
    next_on_pass: S03

  - id: S03
    title: Registry capability and operator contract projection
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s03-completed-20261002.yaml
    objective: Register the lifecycle operation through existing Agent dispatch and document discoverability/readiness semantics.
    primary_surfaces:
      - src/sentinelx_core/handlers/__init__.py
      - capability/help projection as required
      - README.md
      - focused registry and disabled_ops tests
    required_behavior:
      - mutation_scope dispatchable through normal registry
      - ops_supported derives registry truth
      - disabled op is both unadvertised and unreachable
      - dispatchability is not reported as mutation readiness
      - no dedicated Hub MCP tool claim
      - no fixed host/path/version/credential identity
    verification:
      - registry/capability/help tests pass
      - disabled_ops regression passes
      - mixed-fleet unsupported_op behavior preserved
    completion_rule: registry projection and documentation are consistent with actual operation semantics
    next_on_pass: S04

  - id: S04
    title: Scoped execution composition and security regressions
    status: verification_blocked
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s04-verification-blocked-20261002.yaml
    objective: Prove lifecycle-issued authority composes with the existing scoped executor without weakening AppContainer/audit/Job containment.
    primary_surfaces:
      - tests/test_scoped_script_execution.py
      - mutation scope and sandbox regression tests
      - canonical incident regression fixture
    required_behavior:
      - lifecycle-issued scope feeds existing execution_profile=scoped_mutation path
      - operation-class admission remains before material mutation
      - repository/semantic binding remains exact
      - success timeout failure terminalization remains authoritative
      - bound inspect proves terminal state
      - no unrestricted fallback
    verification:
      - scope uniqueness and immutable authority
      - audit START/SPAWN/FINISH ordering
      - Windows AppContainer ACL/Job containment
      - INCIDENT-20260927-D-ROOT-RECURSIVE-DELETE remains protected
      - direct Python remains denied on final Acceptance host when not operator-allowed
    completion_rule: affected security regression matrix is green with fresh evidence
    next_on_pass: S05

  - id: S05
    title: Live generic Hub operation admission evidence
    status: pending
    objective: Establish the external control-plane truth boundary for scope lifecycle admission and record any remaining Hub/tool-surface dependency without fallback.
    required_behavior:
      - use supported short-lived generic Hub operation-relay authorization
      - provision mutation_scope through generic relay
      - verify provider-issued exact scope identity/bindings
      - use an actually supported profiled script_run control surface if available
      - inspect terminal scope through generic relay
      - mismatched repository/lineage attempts fail closed
      - reconfirm direct Python denial and no unrestricted fallback
    external_boundary:
      - PR-008 model-facing script_run projection is independent
      - if generic relay can provision/inspect but profiled script surface remains unavailable, record explicit external blocker rather than weakening Host authority
    completion_rule: live evidence either proves admission path or produces a precise external blocker with repository-local implementation evidence intact
terminal_transition:
  when_all_repository_slices_complete: acceptance
  acceptance_requires_external_evidence: true
