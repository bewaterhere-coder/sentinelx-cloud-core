      existing_primitive: sentinelx_core.mutation_placement.RepositoryIdentity
      parallel_normalizer: sentinelx_core.policy._canonical_repository_identity
      required_resolution: reuse or extract one shared provider repository identity semantic with explicit authority/port behavior and compatibility evidence
    superseded_blocker:
