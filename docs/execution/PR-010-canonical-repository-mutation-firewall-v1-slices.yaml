      - structured mutators consume central admission before backup, overwrite, delete, patch, metadata change or final materialization
    verification:
      - unknown/unclassified model-facing op => readiness false
      - unknown Git selector => readiness false
      - local_api configured action with no valid effect contract => readiness false
      - known read-only/non_repository local_api action => does not falsely require repository mutation coverage
