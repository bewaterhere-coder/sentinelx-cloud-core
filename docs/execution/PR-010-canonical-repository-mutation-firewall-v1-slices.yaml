retained_history:
  prior_plan_revision: 2
  prior_plan_review: docs/reviews/PR-010-canonical-repository-mutation-firewall-v1-plan-review-r2.md
  prior_approval_checkpoint: docs/checkpoints/PR-010-canonical-repository-mutation-firewall-v1-plan-review-r2-approved-20261002.yaml
  s01_historical_checkpoint: docs/checkpoints/PR-010-canonical-repository-mutation-firewall-v1-s01-verification-blocked-20261002.yaml
  s01_implementation_head: 62b9fba588fac58161c909e8622278d791c07a92
  no_replay_of_verified_side_effects: true
slices:
  - id: S01
    title: Retained canonical inventory implementation repair and Core revalidation
    status: implementation_retained_revalidation_required
    implementation_retained: true
    slice_completed: false
    objective: Preserve already-landed inventory/firewall work, remove the parallel repository-identity semantic, and revalidate S01 entirely through Core-owned evidence.
    current_blocker:
      code: RepositoryIdentityPrimitiveReuseRequired
      existing_primitive: sentinelx_core.mutation_placement.RepositoryIdentity
      parallel_normalizer: sentinelx_core.policy._canonical_repository_identity
      required_resolution: reuse or extract one shared provider repository identity semantic, including explicit authority/port behavior
    superseded_blocker:
      code: HubExecutionProfileProjectionUnavailable
      disposition: external_integration_limitation_non_blocking
    entry_gate:
      - Plan Revision 3 must be approved before product-code mutation resumes
      - compute exact intended changed-file set
      - if intended files overlap active PR-007/PR-008 surfaces, perform entry_reconciliation before mutation
      - canonical main must be re-read before implementation mutation
    retained_surfaces:
      - src/sentinelx_core/policy.py
      - src/sentinelx_core/canonical_repository_firewall.py
      - tests/test_canonical_repository_firewall.py
    likely_additional_surface:
      - src/sentinelx_core/mutation_placement.py or one provider-neutral shared repository identity module if extraction is needed
    required_behavior:
      - canonical repository inventory remains Host/operator authority
      - canonical roots remain normalized/canonicalized
      - one shared repository identity semantic handles vcs, authority, path, credentials exclusion, authority ports and .git normalization
      - invalid duplicate/conflicting/ambiguous inventory makes readiness false
      - execution workspaces are not inferred canonical solely from repository identity
      - broad parent file_ops rw does not alter canonical classification
      - prior Hub projection failure is not used as completion evidence or blocker
    verification:
      - focused repository identity normalization tests including explicit authority ports
      - traversal and symlink normalization cases
      - duplicate/conflicting inventory failure cases
      - canonical root versus same-repository execution workspace cases
      - caller payload cannot create/remove canonical inventory authority
      - indeterminate classification fails closed for material mutation
      - Core-owned focused unit test execution/readback
    completion_rule: one repository identity semantic is proven and focused Core-owned S01 verification passes; handler-wide mutation coverage is not yet claimed
    next_on_pass: S02

  - id: S02
    title: Authoritative operation-effect registry and structured mutation integration
    status: planned_not_authorized
    objective: Extend authoritative Core operation registration into fail-closed coverage truth and wire explicit-path mutators through the central firewall before material side effects.
    entry_gate:
      - S01 completed under Requirement Revision 2
      - compute exact intended changed-file set
      - run entry_reconciliation before mutating handlers/__init__.py or any current dependency-overlap surface
      - persist observed dependency heads and no-loss composition decision for this Slice
    primary_surfaces:
      - src/sentinelx_core/handlers/__init__.py
      - src/sentinelx_core/handlers/edit.py
      - src/sentinelx_core/handlers/fsmutate.py
      - src/sentinelx_core/handlers/git_ops.py
      - src/sentinelx_core/handlers/upload.py
      - registry/capability coverage tests
      - structured mutation firewall tests
    required_behavior:
      - authoritative registration carries handler plus exposure/repository-effect/firewall-coverage semantics or equivalent fail-closed metadata
      - dispatch and ops_supported remain derived from the same authoritative registry
      - new effective model-facing op with missing/unknown repository effect makes firewall readiness false
      - required-but-unproven firewall coverage makes readiness false
      - internal-only operations are explicitly distinguishable from model-facing operations
      - read-only operations are explicitly distinguishable from mutators
      - mixed structured Git mutation selectors cannot hide behind read-only selectors
      - disabled_ops removal precedes effective-surface readiness accounting
      - structured mutators consume central admission before backup, overwrite, delete, patch, metadata change or final materialization
    verification:
      - unknown/unclassified model-facing op => readiness false
      - required uncovered mutator => readiness false
      - internal-only op does not count as model-facing firewall evidence
      - disabled op is absent from effective exposed-surface accounting
      - canonical exact-root/descendant writes block before side effect
      - no .bak artifact on blocked edit/delete
      - move/copy endpoint matrix preserves correct read/write semantics
      - structured Git diff/read behavior remains available
    completion_rule: authoritative coverage accounting and structured mutator regressions pass without a parallel hand-maintained firewall operation list
    next_on_pass: S03

  - id: S03
    title: Core process mutation fail-closed boundary
    status: planned_not_authorized
    objective: Ensure effective exec/script/background process surfaces cannot bypass canonical exclusion while provider-wide Core readiness is claimed, without depending on Hub parameter projection.
    entry_gate:
      - S02 completed
      - mandatory entry_reconciliation against exact current PR-007 and PR-008 state before touching scoped_script/basic/client/mutation-scope/executor or equivalent overlap seams
      - planning/review-time dependency SHAs are evidence only
      - stop on material semantic conflict before product-code mutation
    primary_surfaces:
      - src/sentinelx_core/handlers/exec.py
      - src/sentinelx_core/handlers/scoped_script.py
      - process/background execution admission seams
      - relevant sandbox/mutation-scope composition tests
    required_behavior:
      - authoritative registry identifies effective process-producing operation classes
      - Core computes process disposition independent of Hub execution_profile availability
      - arbitrary unprofiled process execution with no physical canonical exclusion cannot remain effective while firewall capability is advertised
      - legacy compatibility may remain only with firewall readiness unavailable
      - profiled/scoped mutation reuses existing scope/sandbox/audit authority and gains no new caller authority
      - shell/script text or path heuristics are never physical security proof
      - background children, timeout and nonzero paths preserve canonical exclusion
      - operator_unrestricted and allowlist expansion are not fallbacks
    verification:
      - generic git switch attempt cannot mutate canonical checkout under firewall-ready mode
      - shell redirection cannot mutate canonical checkout
      - Python/PowerShell direct and spawned-child canonical writes cannot bypass
      - unclassified process op invalidates readiness
      - scoped execution workspace mutation passes firewall exclusion then remains subject to existing authority/sandbox/audit gates
      - missing Hub execution_profile projection is recorded only as external diagnostic when observed
    completion_rule: process regression matrix proves no generic or child-process canonical mutation bypass while provider-wide Core readiness can be true
    next_on_pass: S04

  - id: S04
    title: Core Capability Readiness and Existing Transport Projection
    status: planned_not_authorized
    objective: Compose final Core readiness/advertisement from inventory, authoritative effective operation surface, structured coverage and process disposition, then verify it through existing SentinelX Core protocol structures without requiring Hub modification or rendering.
    entry_gate:
      - S03 completed
      - re-run entry_reconciliation if PR-007/PR-008 moved since the last recorded reconciliation or this Slice touches an overlap surface
      - read current Core capability/hello/protocol contracts before mutation
    primary_surfaces:
      - Core capability/readiness projection code
      - src/sentinelx_core/handlers/basic.py as required
      - src/sentinelx_core/client.py as required
      - Core protocol-feature/capability tests
    required_behavior:
      - advertise canonical_repository_mutation_firewall_v1 only when policy/inventory valid and every effective Core mutator has proven coverage/disposition
      - exposed unknown/unclassified op removes capability
      - exposed required-but-uncovered mutator removes capability
      - policy disabled leaves legacy host behavior intact but firewall capability unavailable
      - scoped-mutation readiness remains independent from firewall readiness
      - Linux/macOS remain capability-unavailable unless equivalent physical exclusion is proven
      - diagnostics identify uncovered operation classes without leaking unnecessary sensitive paths
      - existing Core hello/capability/protocol output carries readiness when true
      - no Hub source/schema/deployment/dynamic-tool/capability-rendering change is required or claimed
    verification:
      - one unknown exposed op => Core capability absent/unavailable
      - one uncovered mutator => Core capability absent/unavailable
      - valid Windows complete-coverage fixture => Core capability advertised
      - policy disabled => Core capability unavailable with legacy compatibility preserved
      - PR-007/PR-008 existing Core capability semantics are not lost
      - Core hello/protocol readback confirms readiness output
      - Hub projection absence is not an S04 blocker
    completion_rule: partial Core coverage cannot advertise the capability and complete Core coverage is verifiable in existing Core-owned protocol output
    next_on_pass: S05

  - id: S05
    title: Incident regression security suite and documentation
    status: planned_not_authorized
    objective: Freeze the canonical-checkout incident family, run affected Core security regressions on Windows candidate evidence, and document operator/configuration plus immutable-Hub semantics.
    entry_gate:
      - S04 completed
      - re-read canonical main and dependency state if implementation drifted since S04
      - no production Host or Hub upgrade is implied by candidate verification
    primary_surfaces:
      - incident regression tests
      - structured mutation security tests
      - process/background security tests
      - README/configuration documentation
      - SECURITY/THREAT_MODEL or equivalent boundary documentation
    required_behavior:
      - broad parent rw plus canonical edit blocks
      - canonical delete/edit blocks before backup creation
      - structured Git patch against canonical blocks
      - generic process git switch/write blocks under firewall-ready mode
      - indirect/background child canonical write blocks
      - unknown inventory/target classification fails closed
      - canonical read/list/search/status/diff remains usable
      - same-repository non-canonical execution workspace can pass firewall then is evaluated by existing scoped authorities
      - fake canonical_sync claim on generic tool cannot bypass
      - new model-facing op with unknown effect removes capability readiness
      - internal-only transport op does not silently become model-facing coverage evidence
      - Hub execution_profile/dynamic-tool/capability projection omissions are documented external limitations only
    verification:
      - full affected Core unit/security/regression suites
      - Windows fixture with broad rw parent + canonical checkout + separate same-repository execution workspace
      - explicit absence of .bak/partial material side effects on blocked mutations
      - Core capability readiness negative/positive matrices
      - documentation review confirms no Hub implementation requirement
    completion_rule: repository-local Core implementation has durable required evidence and is ready for #开发验收; no production activation, merge, release or Hub change is claimed
terminal_transition:
  plan_review_required_before_execution: true
  when_plan_approved: implementation
  first_slice_after_approval: S01
  when_all_slices_complete: acceptance
  acceptance_requires_windows_incident_evidence: true
  acceptance_requires_provider_wide_core_coverage_evidence: true
  acceptance_requires_hub_projection_evidence: false
