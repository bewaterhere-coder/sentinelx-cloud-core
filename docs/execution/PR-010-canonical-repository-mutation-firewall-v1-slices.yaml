    required_behavior:
      - canonical repository inventory remains Host/operator authority
      - one shared repository identity semantic handles vcs, authority, path, credentials exclusion, authority ports and .git normalization
      - traversal and invalid identity fail closed
      - invalid duplicate/conflicting/ambiguous inventory makes readiness false
      - execution workspaces are not inferred canonical solely from repository identity
      - broad parent file_ops rw does not alter canonical classification
      - existing valid repository/scope bindings are not silently changed
      - stored digest/binding incompatibility triggers a Decision Boundary and explicit compatibility decision
    verification:
      - focused repository identity normalization tests including explicit authority ports
      - traversal and invalid identity cases
      - duplicate/conflicting inventory failure cases
      - canonical root versus same-repository execution workspace cases
      - caller payload cannot create/remove canonical inventory authority
      - indeterminate classification fails closed for material mutation
