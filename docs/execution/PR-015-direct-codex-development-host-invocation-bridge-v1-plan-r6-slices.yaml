slices:
  - slice_id: S04
    title: Provider-Owned Deterministic Persistence & Canonical Publish Closure
    objective: >-
      Extend direct-Codex bootstrap with one provider-owned pre-checkout
      canonicalization authority snapshot, materialize the isolated Codex
      worktree under that exact snapshot, reuse the snapshot for provider-owned
      temporary-index canonical clean staging, create one deterministic
      recovery-safe candidate commit, ordinary fast-forward publish it to the
      exact canonical PR branch, independently read back the remote, and emit a
      persisted direct/codex receipt.
    depends_on: []
    historical_prerequisite_evidence: [S01, S02, S03]
    state: pending
    scope:
      refs:
        - src/sentinelx_core/direct_codex_transport.py
        - src/sentinelx_core/direct_codex_persistence.py
        - src/sentinelx_core/direct_codex_result.py
        - src/sentinelx_core/handlers/direct_codex.py
        - src/sentinelx_core/user_git.py
        - focused direct-Codex transport/persistence tests
        - focused Windows canonicalization/filter/recovery fixtures
      authorized_changes:
        - separate authenticated object acquisition from first worktree materialization
        - capture and durably bind safe normalization snapshot before checkout
        - inspect expected-tree attributes before checkout and reject any effective custom filter across tracked paths
        - neutralize system/global attribute authority and require git info attributes absent or empty
        - perform provider-clamped checkout with no hooks, fsmonitor, submodule recursion, editor, pager, prompt or arbitrary materialization config authority
        - reject versioned .gitattributes mutation in V1
        - build candidate through provider-owned temporary index seeded from expected_remote_sha
        - reuse exact pre-checkout snapshot for canonical clean staging
        - preserve builtin text/eol, binary, ident and supported working-tree-encoding semantics
        - persist recovery journal outside candidate set
        - freeze all commit-SHA inputs before candidate creation
        - reconstruct bit-identical candidate on same-attempt recovery
        - persist publish_intent before first push
        - ordinary fast-forward publish exact candidate to exact canonical branch
        - independent remote readback and persistence receipt extension
      forbidden:
        - trusting Codex-owned index as candidate authority
        - custom or external filter execution at checkout or persistence
        - versioned .gitattributes mutation through V1 persistence path
        - generic Git or shell surface
        - caller Git argv, pathspec, commit metadata, remote or branch override
        - force or force-with-lease
        - replacement branch or PR
        - canonical checkout mutation
        - permission or credential expansion
        - provider rebinding
        - production Hub mutation
    verification:
      required:
        - clone/fetch obtains exact admitted commit without worktree materialization
        - safe canonicalization snapshot is persisted and read back before checkout
        - custom filter assignment on any tracked expected-tree path fails before checkout and marker process never runs
        - system/global attributes are neutralized and non-empty .git/info/attributes blocks checkout
        - provider-clamped checkout uses the exact frozen snapshot
        - Windows CRLF worktree for parent LF blob re-canonicalizes to exact parent blob when unchanged
        - one-line semantic edit does not create whole-file EOL churn
        - binary bytes remain exact and supported working-tree-encoding round-trips deterministically
        - Codex add/delete/modify of versioned .gitattributes fails before candidate creation
        - pre-staged excluded Codex-index entry cannot enter provider candidate tree
        - temporary candidate index is seeded from exact admitted parent and contains only validated canonical eligible delta
        - hooks/signing/fsmonitor/editor/pager/prompt/submodule recursion cannot execute through local materialization/persistence path
        - unmerged state, unsupported gitlink/submodule mutation and path escape fail closed
        - same attempt reconstructs bit-identical candidate across prepared/tree_ready/candidate_ready/local-ref-ready interruptions
        - publish_intent recovery performs readback only and never automatic second push
        - remote drift before publish fails without push
        - ordinary push targets only exact canonical branch and remote readback must equal candidate
        - no eligible changes does not manufacture empty implementation commit
        - malformed or local-only persistence receipt cannot be success
        - canonical checkout branch/head/index/worktree remain unchanged
        - existing S01-S03 direct-Codex/firewall/scoped-verification/user-scoped-Git regressions remain green
        - real Windows @openai/codex physical fixture proves edit -> provider commit -> ordinary fixture-branch push -> remote readback -> persisted direct/codex receipt
    external_availability_rule: >-
      real Windows physical checkout/filter/canonicalization/direct-Codex
      persistence proof is required for Slice completion
    checkpoint:
      required: true

