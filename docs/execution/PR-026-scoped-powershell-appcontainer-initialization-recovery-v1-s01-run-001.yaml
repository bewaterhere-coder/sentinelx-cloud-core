changes:
  - src/sentinelx_core/winspawn.py:
      SuspendedJobProcess.close() samples the raw child exit DWORD via
      GetExitCodeProcess while the process handle is still open and persists
      it as _last_exit_code; the exit_code property returns the snapshot after
      closure (explicit negative readback stays None). Read-only diagnostic
      accessor; termination/containment behavior unchanged.
  - src/sentinelx_core/handlers/scoped_script.py:
      the missing-result-marker branch now samples process.exit_code BEFORE
      sandbox.terminalize(scope_id, generation), records it as returncode in
      the durable OPERATION_FINISHED event, and raises
      HostMutationSandboxUnavailable with the raw status as decimal plus
      0x%08X (or an explicit "unavailable" negative readback). No synthetic
      script-level return code is introduced; no fallback path added.
  - tests/test_scoped_script_execution.py:
      + test_scoped_powershell_startup_failure_preserves_raw_child_exit_status
      + test_suspended_job_process_exit_code_snapshot_survives_close

