slices:
  - id: S06
    title: Built-in devforge_runtime endpoint and lifecycle composition
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s06-completed-20261002.yaml
    objective: Add a bounded Agent-owned built-in endpoint behind the existing local_api envelope, sharing the existing mutation-scope lifecycle authority while preserving external local_api and disabled_ops semantics.
    primary_surfaces:
      - src/sentinelx_core/handlers/local_api.py
      - src/sentinelx_core/local_api.py
      - src/sentinelx_core/handlers/mutation_scope.py
      - src/sentinelx_core/handlers/__init__.py
      - focused local_api/registry/lifecycle tests
    required_behavior:
      - local_api is registered when at least one configured external endpoint exists or one eligible non-colliding builtin endpoint exists
      - builtin devforge_runtime eligibility derives from existing mutation_execution Host opt-in
      - local_api handler is context-aware for builtin calls without forwarding transport context to existing external endpoints
      - lifecycle actions reuse one canonical lifecycle service over MutationScopeStore
      - disabled_ops local_api removes the whole outer operation through existing registry semantics
      - disabled_ops mutation_scope removes builtin lifecycle actions from describe and direct-call admission
      - disabled_ops script_run removes execute_scoped from describe and direct-call admission
      - list/describe/call use the same policy-derived action admission function
      - configured external endpoint named devforge_runtime retains external meaning and builtin is unavailable on that Host
      - builtin describe reports provider_kind=builtin, contract_id=devforge_runtime, contract_revision=1
      - no caller authority-shaped fields are accepted
    verification:
      - no mutation policy and no external endpoints leaves local_api unregistered
      - existing external-only local_api behavior is unchanged
      - eligible builtin is listed/described with exact identity metadata
      - disabled local_api/mutation_scope/script_run cases are unadvertised and unreachable through the corresponding paths
      - mixed disabled cases do not affect unrelated configured external endpoints
      - external devforge_runtime collision is deterministic and never invokes builtin authority
      - provision/revalidate/inspect/terminalize preserve exact repository/lineage/generation semantics
      - terminal inspect remains non-reactivating
    completion_rule: focused S06 tests and compile/import checks pass, no duplicate lifecycle/store authority exists, and checkpoint evidence is durably read back
    next_on_pass: S07

  - id: S07
    title: execute_scoped adapter, bounded projection and no-fallback regressions
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s07-completed-20261002.yaml
    objective: Expose bounded scoped execution through devforge_runtime while reusing the existing profiled scoped executor and preventing provider-private path/debug leakage or policy bypass.
    primary_surfaces:
      - builtin devforge_runtime provider/handler
      - src/sentinelx_core/handlers/scoped_script.py
      - RequestContext plumbing
      - focused integration/security tests
    required_behavior:
      - adapter injects execution_profile=scoped_mutation internally
      - adapter injects cleanup=true internally
      - caller execution_profile and cleanup fields are rejected before inner invocation
      - exact outer RequestContext is passed to the existing profiled scoped execution path
      - existing scope operation-class/repository/semantic revalidation remains before material mutation
      - AppContainer, audit START, evidence materialization, spawn, Job containment and terminalization stay owned by existing scoped executor
      - inner result is projected through a positive model-facing allowlist
      - workdir, script_path, exact provider paths, provider-private argv/path authority, and unknown future fields are dropped
      - disabled_ops script_run blocks execute_scoped even on direct builtin call
      - no failure path falls back to shell, exec, direct Python allowlist, operator_unrestricted or legacy compatibility
    verification:
      - valid provider scope performs one deterministic harmless scoped execution
      - repository/lineage/generation mismatches fail before material mutation
      - caller profile/cleanup/workspace/operation-class authority fails closed
      - synthetic inner workdir/script_path/future debug/path fields do not escape projection
      - audit START remains before materialization/spawn
      - success/failure/timeout terminalization remains authoritative
      - disabled script_run prevents direct builtin invocation
      - INCIDENT-20260927-D-ROOT-RECURSIVE-DELETE regression remains green
    completion_rule: S07 focused/security regression matrix passes with no duplicate executor/sandbox/audit path and checkpoint evidence is durably read back
    next_on_pass: S08

  - id: S08
    title: Known-build activation and real sentinel_local_api end-to-end evidence
    status: completed
    checkpoint_ref: docs/checkpoints/PR-007-host-mutation-scope-control-surface-mcp-admission-bridge-v1-s08-completed-20261003.yaml
    objective: Prove the approved Agent-owned bridge through the actual model-visible sentinel_local_api interface on one exact known build, without modifying the Hub.
    primary_surfaces:
      - existing release/development activation contract
      - connected Windows SentinelX Host
      - model-facing sentinel_local_api list/describe/call
      - runtime capability/readback and security evidence
    required_behavior:
      - build/activate an exact PR-007 candidate using existing authorized activation mechanisms
      - prove exact Agent build/version/capability after activation
      - sentinel_local_api list includes eligible devforge_runtime
      - describe proves provider_kind=builtin, contract_id=devforge_runtime, contract_revision=1 and policy-filtered actions
      - provision exact repository/task/run/attempt[/slice] scope
      - execute one harmless deterministic marker via execute_scoped
      - model-facing result exposes no exact provider workspace/script path
      - inspect exact scope proves terminal/non-active state
      - mismatched repository/lineage attempt fails closed
      - disabled-action semantics are proven by safe live policy evidence when already available, otherwise exact known-build policy/readback plus focused regression; no separate unauthorized live policy mutation is implied
      - ordinary direct python --version remains command_not_allowed when not operator-allowlisted
      - affected security regression evidence is read back
    external_boundary:
      - production mcp.sentinelx.app remains unchanged
      - PR-008 and PR-009 are not completion dependencies
      - unsupported or stale live Agent state blocks completion rather than authorizing fallback
    completion_rule: real sentinel_local_api receipt plus exact Host/Agent readback proves provision -> scoped execute -> terminal inspect and negative checks with no Hub mutation or unrestricted fallback
    next_on_pass: acceptance
